# 一键拉起完整环境：MySQL + MinIO + 应用
#   docker compose up -d --build
# 首次启动 app 会自动跑迁移建表；MinIO 桶由 minio-init 自动创建
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bookkeeping
      TZ: Asia/Shanghai
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'  # S3 API
      - '9001:9001'  # 管理控制台
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20

  # 一次性任务：MinIO 就绪后创建项目使用的桶（FileService 里桶名固定为 bookkeeping）
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/bookkeeping"

  app:
    build: .
    environment:
      NODE_ENV: production
      # 数据库/MinIO 连接走容器网络内的服务名
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root
      DB_DATABASE: bookkeeping
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      # 以下密钥仅限本地体验，生产环境务必通过部署平台注入强随机值
      JWT_SECRET: change-me
      JWT_EXPIRED: 1d
      FILE_SECRET: change-me
      FILE_TOKEN_EXPIRED: 1d
      REFRESH_SECRET: change-me
      REFRESH_TOKEN_EXPIRED: 30d
      # AI 代理：从宿主机环境变量透传（可为空，为空时 /v1/ai/* 返回 503）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    ports:
      - '3031:3031'
    volumes:
      # /static 静态文件的实际落盘位置（main.ts: dist/../uploads）
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  mysql-data:
  minio-data:
